services:
  field-api:
    build:
      context: .
    environment:
      AETHER_FIELD_DB: /data/field.sqlite3
      AETHER_FIELD_MEDIA: /data/media
      AETHER_FIELD_PORT: "9443"
      AETHER_FIELD_TLS_CERT: /certs/server.pem
      AETHER_FIELD_TLS_KEY: /certs/server.key
      AETHER_FIELD_TLS_CA: /certs/ca.pem
      AETHER_FIELD_TLS_KEY_PASSWORD_FILE: /certs/key-password
      AETHER_FIELD_PUBLISHER_CNS: "${AETHER_FIELD_PUBLISHER_CNS:-Al}"
    ports:
      - "${AETHER_FIELD_BIND_IP:-127.0.0.1}:9443:9443"
    volumes:
      - field_data:/data
      - "${AETHER_TAK_CERT_DIR:?Set AETHER_TAK_CERT_DIR}:/certs:ro"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  chirpstack-bridge:
    profiles: ["chirpstack"]
    build:
      context: .
    command: ["python", "/app/chirpstack_bridge.py"]
    environment:
      AETHER_FIELD_DB: /data/field.sqlite3
      AETHER_FIELD_MEDIA: /data/media
      AETHER_CHIRPSTACK_BINDINGS: /config/bindings.json
      AETHER_CHIRPSTACK_MQTT_HOST: "${AETHER_CHIRPSTACK_MQTT_HOST:-mosquitto}"
      AETHER_CHIRPSTACK_MQTT_PORT: "1883"
      AETHER_CHIRPSTACK_MQTT_USERNAME: "${AETHER_CHIRPSTACK_MQTT_USERNAME:-aether-field}"
      AETHER_CHIRPSTACK_MQTT_PASSWORD_FILE: /run/secrets/mqtt-password
    volumes:
      - field_data:/data
      - "${AETHER_CHIRPSTACK_BINDINGS_FILE:-./chirpstack-bindings.example.json}:/config/bindings.json:ro"
      - "${AETHER_CHIRPSTACK_MQTT_PASSWORD_FILE:-./local/mqtt-password}:/run/secrets/mqtt-password:ro"
    networks:
      - chirpstack
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  field_data:

networks:
  chirpstack:
    external: true
    name: "${AETHER_CHIRPSTACK_NETWORK:-chirpstack_default}"
